# Master Config file to change variables around
MODEL_TYPE: chanvit_mae   # Model Types available - vit, mae, dinov2, dinov3, openphenom, subcell, chanvit_simclr in some cases
MODEL_PATH: /scr/vidit/Foundation_Models/iclr_model_weights/MAE_CHANViT_CHAMMI/checkpoint_epoch_100.pt
MODEL_SIZE: small

# CHAMMI Benchmark
CHAMMI: True  # Enable CHAMMI benchmark
CHAMMI_IMAGES_PATH: /scr/data/CHAMMI/dataset
CHAMMI_FEATURES_PATH: /scr/jpeters/chammi_75_benchmarks/chammi_features
CHAMMI_SCORE_PATH: /scr/jpeters/chammi_75_benchmarks/chammi_scores
CHAMMI_BATCH_SIZE: 8

# HPA Benchmark
HPA: False  # Enable HPA benchmark
HPA_IMAGES_PATH: /scr/data/75ds_test/mini-hpa
HPA_FEATURES_PATH: /scr/jpeters/chammi_75_benchmarks/hpa_features
HPA_SCORE_PATH: /scr/jpeters/chammi_75_benchmarks/hpa_scores
HPA_BATCH_SIZE: 16
HPA_NUM_WORKERS: 8

#JUMP-CP Benchmark


#IDR-17 Benchmark
IDR-17: False # Enable/disable IDR-17 benchmark
# Paths and directories used for all rules
IDR_DATA_FOLDER: /scr/data/75ds_test/idr0017_mini
IDR_CACHE: /scr/jpeters/chammi_75_benchmarks/17cache # location where it will temporarily unzip things
IDR_CROP: 100 # Size of the single cell crop
IDR_RESIZE: 224 # Resized each patch to what
IDR_BATCH_SIZE: 2048
IDR_NUM_WORKERS: 8
IDR_THREADS: 16

# Neuron Features Benchmark
NEURON_FEATURES: True  # Enable Neuron Features benchmark
NEURON_IMAGES_PATH: /scr/data/75ds_test/neuron-features
NEURON_FEATURES_PATH: /scr/jpeters/chammi_75_benchmarks/neron_features
NEURON_SCORE_PATH: /scr/jpeters/chammi_75_benchmarks/neron_scores
NEURON_BATCH_SIZE: 16
NEURON_NUM_WORKERS: 8
